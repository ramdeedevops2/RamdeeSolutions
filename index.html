<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ramdee-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramdee Solutions — Engineering Studio</title>
    <meta name="description" content="Ramdee Solutions builds web platforms, cloud infrastructure, AI automation and secure systems for growing businesses." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // apply the stored theme before first paint to avoid a flash
      (function () {
        try {
          var s = localStorage.getItem('ramdee-theme');
          var t = s === 'light' || s === 'dark' ? s
            : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
